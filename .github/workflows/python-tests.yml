name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend migrations scripts
      - name: Run offline backend tests
        run: python -m pytest backend -q --tb=short -p no:cacheprovider
        env:
          PYTHONPATH: backend
          RATE_LIMIT_REDIS_REQUIRED: "false"
          DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci_db
          JWT_SECRET_KEY: ci-only-test-key-not-for-deployment
